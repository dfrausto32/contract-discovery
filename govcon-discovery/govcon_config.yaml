# GovCon API Opportunity Discovery — configuration
#
# Searches for federal IT/software engineering opportunities matching the profile
# of a backend services developer and deployment pipeline engineer. Primary focus
# is civilian federal agencies (commercial gov); defense opportunities are also
# considered where they align with the same skill set.

govcon:
  # GovCon API base URL and the delta endpoint path.
  base_url: "https://govconapi.com/api/v1"
  delta_path: "/opportunities/delta"
  # Results per request. Developer/Pro plans allow up to 1000; free trial 50.
  page_size: 1000
  # Used ONLY on the first run (no sync state yet). The API caps `since` at 60
  # days, so values above 60 are clamped server-side.
  initial_lookback_days: 30
  # Notice types to keep (active pre-award only), matched against `notice_type`.
  notice_types:
    - "Solicitation"
    - "Combined Synopsis/Solicitation"
    - "Presolicitation"
    - "Sources Sought"
  # NAICS codes covering backend software development, DevOps, cloud, and IT
  # engineering services. The delta feed is not NAICS-filtered server-side, so
  # this list is used for client-side relevance scoring only.
  naics:
    - "541511"  # Custom computer programming services
    - "541512"  # Computer systems design services
    - "541519"  # Other computer-related services (DevSecOps, platform eng)
    - "518210"  # Computing infrastructure, data processing, web hosting
    - "541330"  # Engineering services
    - "541715"  # R&D in physical, engineering & life sciences

relevance:
  # --- Stage 1: deterministic keyword / NAICS pre-filter ---
  naics:
    - "541511"
    - "541512"
    - "541519"
    - "518210"
    - "541330"
    - "541715"
  # Strong fit signals — backend dev, DevOps, cloud-native, pipeline work.
  # Each distinct hit adds boost_weight.
  boost_keywords:
    - "backend"
    - "back-end"
    - "microservices"
    - "api development"
    - "restful"
    - "rest api"
    - "devops"
    - "devsecops"
    - "dev/sec/ops"
    - "ci/cd"
    - "continuous integration"
    - "continuous deployment"
    - "kubernetes"
    - "containerization"
    - "docker"
    - "cloud native"
    - "cloud-native"
    - "infrastructure as code"
    - "it modernization"
    - "digital transformation"
    - "cloud migration"
    - "software development"
    - "software engineering"
    - "platform engineering"
    - "site reliability"
    - "sre"
  # Weaker supporting signals. Each distinct hit adds include_weight.
  include_keywords:
    - "agile"
    - "scrum"
    - "python"
    - "aws"
    - "azure"
    - "cloud"
    - "database"
    - "automation"
    - "pipeline"
    - "deployment"
    - "api"
    - "web services"
    - "full stack"
    - "full-stack"
    - "terraform"
    - "ansible"
    - "git"
    - "software"
  # Any of these in the title disqualifies the opportunity outright.
  exclude_keywords:
    - "janitorial"
    - "landscaping"
    - "food service"
    - "lawn"
    - "uniform"
    - "furniture"
    - "grounds maintenance"
    - "custodial"
    - "mowing"
    - "pest control"
  boost_weight: 25
  include_weight: 6
  naics_weight: 20
  # A candidate must reach this score (0-100, capped) to advance to the AI stage.
  # With NAICS worth 20 and boost keywords worth 25 each, a threshold of 45
  # requires at least one strong keyword match on top of a NAICS hit — filtering
  # out the vast majority of generic IT contracts that only match on NAICS.
  stage1_threshold: 45

ai:
  # Provider: "openai" (uses OPENAI_API_KEY) or "claude" (uses ANTHROPIC_API_KEY).
  # If the relevant key is absent, a deterministic template doc is written and
  # ai_generated is recorded as false so the pipeline still runs end-to-end.
  provider: "openai"
  openai_model: "gpt-5.4"
  claude_model: "claude-opus-4-7"
  max_tokens: 5000
  # Keep an opportunity only when the AI relevance score is at least this.
  score_threshold: 60
  # Generate a game plan (gameplan.md) for kept opportunities at or above this score.
  gameplan_threshold: 80

output:
  # Folder (committed to the repo) where per-contract docs are written.
  dir: "opportunities"
