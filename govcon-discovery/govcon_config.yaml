# GovCon API Opportunity Discovery — configuration
#
# Searches for federal IT/software engineering opportunities. The candidate
# profile covers backend services, DevOps/CI-CD, cybersecurity/ZeroTrust,
# data engineering/ETL, IT consulting/advisory, and custom solution development.
# Civilian agency work is weighted slightly higher; defense work is included
# when it calls for the same technical skill set.

govcon:
  # GovCon API base URL and the delta endpoint path.
  base_url: "https://govconapi.com/api/v1"
  delta_path: "/opportunities/delta"
  # Results per request. Developer/Pro plans allow up to 1000; free trial 50.
  page_size: 1000
  # Used ONLY on the first run (no sync state yet). The API caps `since` at 60
  # days, so values above 60 are clamped server-side.
  initial_lookback_days: 60
  # Notice types to keep (active pre-award only), matched against `notice_type`.
  notice_types:
    - "Solicitation"
    - "Combined Synopsis/Solicitation"
    - "Presolicitation"
    - "Sources Sought"
  # NAICS codes. The delta feed is not NAICS-filtered server-side; this list
  # is used for client-side relevance scoring only.
  naics:
    - "541511"  # Custom computer programming services
    - "541512"  # Computer systems design services
    - "541519"  # Other computer-related services (DevSecOps, platform eng)
    - "518210"  # Computing infrastructure, data processing, web hosting
    - "541330"  # Engineering services
    - "541690"  # Other scientific and technical consulting
    - "541715"  # R&D in physical, engineering & life sciences
    - "541990"  # All other professional, scientific, and technical services

relevance:
  # --- Stage 1: deterministic keyword / NAICS pre-filter ---
  naics:
    - "541511"
    - "541512"
    - "541519"
    - "518210"
    - "541330"
    - "541690"
    - "541715"
    - "541990"
  # Strong fit signals — each distinct hit adds boost_weight.
  boost_keywords:
    # Backend / API / DevOps
    - "backend"
    - "back-end"
    - "microservices"
    - "api development"
    - "restful"
    - "rest api"
    - "devops"
    - "devsecops"
    - "dev/sec/ops"
    - "ci/cd"
    - "continuous integration"
    - "continuous deployment"
    - "kubernetes"
    - "containerization"
    - "docker"
    - "cloud native"
    - "cloud-native"
    - "infrastructure as code"
    - "it modernization"
    - "digital transformation"
    - "cloud migration"
    - "software development"
    - "software engineering"
    - "platform engineering"
    - "site reliability"
    - "sre"
    # Cybersecurity / ZeroTrust
    - "cybersecurity"
    - "cyber security"
    - "zero trust"
    - "zerotrust"
    - "fedramp"
    - "information security"
    - "identity and access management"
    - "iam"
    - "vulnerability management"
    - "security operations"
    - "siem"
    - "rmf"
    - "ato"
    # Data engineering / ETL
    - "data engineering"
    - "data pipeline"
    - "etl"
    - "data lake"
    - "data warehouse"
    - "data integration"
    - "analytics platform"
    - "business intelligence"
    # IT consulting / advisory / custom solutions
    - "system integration"
    - "enterprise architecture"
    - "solution architecture"
    - "technical advisory"
    - "application development"
    - "custom development"
    - "managed services"
    - "it operations"
    - "it support services"
  # Weaker supporting signals. Each distinct hit adds include_weight.
  include_keywords:
    - "agile"
    - "scrum"
    - "python"
    - "aws"
    - "azure"
    - "gcp"
    - "cloud"
    - "database"
    - "automation"
    - "pipeline"
    - "deployment"
    - "api"
    - "web services"
    - "full stack"
    - "full-stack"
    - "terraform"
    - "ansible"
    - "git"
    - "software"
    - "security"
    - "compliance"
    - "monitoring"
    - "observability"
    - "linux"
    - "javascript"
    - "node.js"
    - "web application"
    - "technical support"
    - "it consulting"
    - "data analysis"
    - "reporting"
    - "dashboard"
  # Any of these in the title disqualifies the opportunity outright.
  exclude_keywords:
    - "janitorial"
    - "landscaping"
    - "food service"
    - "lawn"
    - "uniform"
    - "furniture"
    - "grounds maintenance"
    - "custodial"
    - "mowing"
    - "pest control"
    - "medical equipment"
    - "construction"
    - "hvac"
    - "plumbing"
    - "electrical contractor"
  boost_weight: 25
  include_weight: 6
  naics_weight: 20
  # A candidate must reach this score to advance to Stage 2 description scan.
  # Threshold of 40 = one strong boost keyword (25) + something, or NAICS (20)
  # + two include keywords (12). Cuts broad-match noise before Stage 2 runs.
  stage1_threshold: 40

stage2:
  # combined_score (stage1 + desc_score) thresholds after the description deep-scan.
  # Opportunities below desc_score_floor are silently dropped (skipped_stage2).
  # Between floor and keep they land in the dashboard as low-signal rows (hidden by default).
  # At or above keep they are kept_pending — high-priority for AI enrichment.
  desc_score_keep: 80   # strong tech/contract signal required for kept_pending
  desc_score_low: 55    # moderate signal for pending_low (visible via toggle)
  desc_score_floor: 35  # anything below this is noise — silently dropped

ai:
  # Provider: "openai" (uses OPENAI_API_KEY) or "claude" (uses ANTHROPIC_API_KEY).
  # If the relevant key is absent, a deterministic template doc is written and
  # ai_generated is recorded as false so the pipeline still runs end-to-end.
  provider: "openai"
  openai_model: "gpt-5.4"
  claude_model: "claude-opus-4-7"
  max_tokens: 5000
  # Keep an opportunity when the AI relevance score is at or above this.
  # Lowered to 55 to surface adjacent / adaptable fits.
  score_threshold: 55
  # Opportunities scoring in [review_min, score_threshold) go to the review queue
  # instead of being silently dropped. Scored writeups are written to disk.
  review_min: 35
  # If stage1 score >= auto_keep_stage1, the opp bypasses the review queue — it
  # follows the normal keep/skip path regardless of AI score. Strong keyword signal
  # means we trust the AI decision directly.
  auto_keep_stage1: 65
  # Generate a game plan (gameplan.md) for kept opportunities at or above this score.
  gameplan_threshold: 80
  # Number of parallel AI scoring threads.
  max_workers: 5

output:
  # Folder (committed to the repo) where per-contract docs are written.
  dir: "opportunities"
