name: TReX SAM.gov Discovery (paused)

# PAUSED: the daily schedule is intentionally disabled while we focus on the
# GovCon pipeline. This workflow still runs on manual dispatch. To resume daily
# runs, uncomment the schedule block below.
on:
  # schedule:
  #   - cron: '0 8 * * *'   # Every day at 08:00 UTC
  workflow_dispatch:
    inputs:
      lookback:
        description: "Days to look back (blank = use config default). Use e.g. 30 for a one-time backfill."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SAM.gov key health
        continue-on-error: true
        working-directory: trex-discovery
        run: python trex.py health
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}

      - name: Pull opportunities and generate docs
        working-directory: trex-discovery
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOOKBACK: ${{ github.event.inputs.lookback }}
        run: |
          if [ -n "$LOOKBACK" ]; then
            python trex.py run --lookback "$LOOKBACK"
          else
            python trex.py run
          fi

      - name: Commit new opportunities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trex-discovery/opportunities trex-discovery/data/trex_seen.db trex-discovery/data/key_meta.json
          git diff --cached --quiet || git commit -m "chore: daily TReX opportunity pull [skip ci]"
          git push
