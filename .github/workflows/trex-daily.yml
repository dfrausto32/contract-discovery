name: TReX SAM.gov Discovery

on:
  schedule:
    - cron: '0 8 * * *'   # Every day at 08:00 UTC
  workflow_dispatch:        # Manual trigger from the Actions UI

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Writes a liveness + days-to-expiry line to the job summary. Continues
      # on error so an expired key is still surfaced in the run summary.
      - name: SAM.gov key health
        continue-on-error: true
        run: python trex.py health
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}

      - name: Pull opportunities and generate docs
        run: python trex.py run
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit new opportunities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opportunities data/trex_seen.db data/key_meta.json
          git diff --cached --quiet || git commit -m "chore: daily TReX opportunity pull [skip ci]"
          git push
