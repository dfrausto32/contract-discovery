name: GovCon Dashboard Deploy

on:
  push:
    branches: [contract-discovery]
    paths:
      - 'govcon-discovery/dashboard.py'
      - 'govcon-discovery/dashboard-ui/**'
      - '.github/workflows/govcon-ui-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data.json
        working-directory: govcon-discovery
        run: python dashboard.py build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govcon-discovery/dashboard-ui/package-lock.json

      - name: Build React dashboard
        working-directory: govcon-discovery/dashboard-ui
        run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: govcon-discovery/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
