name: GovCon Opportunity Discovery

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily, after GovCon's 02:00 UTC data refresh
  push:
    branches: [contract-discovery]
    paths:
      - 'govcon-discovery/govcon.py'
      - 'govcon-discovery/govcon_client.py'
      - 'govcon-discovery/store.py'
      - 'govcon-discovery/ai_fit.py'
      - 'govcon-discovery/relevance.py'
      - 'govcon-discovery/govcon_config.yaml'
      - 'requirements.txt'
      - '.github/workflows/govcon-daily.yml'
  workflow_dispatch:
    inputs:
      since:
        description: "Override delta start (ISO 8601, e.g. 2026-05-01T00:00:00Z). Blank = saved sync state."
        required: false
        default: ""
      full:
        description: "Ignore saved sync state and use initial_lookback_days (use for the first backfill)."
        type: boolean
        required: false
        default: false
      limit:
        description: "Max opportunities to evaluate this run (blank = no limit). Use 150-200 for backfill batches."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: GovCon key health
        continue-on-error: true
        working-directory: govcon-discovery
        run: python govcon.py health
        env:
          GOVCON_API_KEY: ${{ secrets.GOVCON_API_KEY }}

      - name: Pull opportunities and generate docs
        working-directory: govcon-discovery
        env:
          GOVCON_API_KEY: ${{ secrets.GOVCON_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SINCE: ${{ github.event.inputs.since }}
          FULL: ${{ github.event.inputs.full }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=""
          if [ -n "$SINCE" ]; then ARGS="$ARGS --since $SINCE"; fi
          if [ "$FULL" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python govcon.py run $ARGS

      - name: Commit new opportunities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add govcon-discovery/opportunities govcon-discovery/data/govcon_seen.db govcon-discovery/data/govcon_sync.json
          git diff --cached --quiet || git commit -m "chore: daily GovCon opportunity pull [skip ci]"
          git pull --rebase origin contract-discovery
          git push

      - name: Generate data.json
        working-directory: govcon-discovery
        run: python dashboard.py build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govcon-discovery/dashboard-ui/package-lock.json

      - name: Build React dashboard
        working-directory: govcon-discovery/dashboard-ui
        run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: govcon-discovery/site

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
