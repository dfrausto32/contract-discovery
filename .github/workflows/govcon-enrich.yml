name: GovCon AI Enrichment

# Run AI scoring on kept_pending records discovered by the daily run.
# Separate from govcon-daily.yml so AI timeouts never block discovery.

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC — 30 min after the daily discovery run
  workflow_dispatch:
    inputs:
      limit:
        description: "Max records to enrich by score (ignored when notice_ids is set)"
        required: false
        default: "30"
      notice_ids:
        description: "Comma-separated notice_ids to enrich (leave blank to use limit)"
        required: false
        default: ""
      dismiss_ids:
        description: "Comma-separated notice_ids to permanently dismiss"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: contract-discovery

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI enrichment
        working-directory: govcon-discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
          NOTICE_IDS: ${{ github.event.inputs.notice_ids }}
          DISMISS_IDS: ${{ github.event.inputs.dismiss_ids }}
        run: |
          if [ -n "$DISMISS_IDS" ]; then
            python govcon.py dismiss --ids "$DISMISS_IDS" 2>&1 | tee -a govcon-enrich.log
          fi
          if [ -n "$NOTICE_IDS" ]; then
            python govcon.py enrich --ids "$NOTICE_IDS" 2>&1 | tee govcon-enrich.log
          else
            python govcon.py enrich --limit "$LIMIT" 2>&1 | tee govcon-enrich.log
          fi

      - name: Upload enrich log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govcon-enrich-log-${{ github.run_number }}
          path: govcon-discovery/govcon-enrich.log
          retention-days: 30

      - name: Commit enriched opportunities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add govcon-discovery/opportunities govcon-discovery/data/govcon_seen.db
          git diff --cached --quiet || git commit -m "chore: AI enrichment run [skip ci]"
          git pull --rebase -X ours origin contract-discovery
          git push

      - name: Generate data.json
        working-directory: govcon-discovery
        run: python dashboard.py build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govcon-discovery/dashboard-ui/package-lock.json

      - name: Build React dashboard
        working-directory: govcon-discovery/dashboard-ui
        run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: govcon-discovery/site

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
